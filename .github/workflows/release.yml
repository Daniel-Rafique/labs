name: Create Release on Merge

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Install dependencies (if needed for building the package)
    - name: Install dependencies
      run: npm install

    # Step 3: Build the package (if applicable)
    - name: Build the package
      run: npm run build

    # Step 4: Package artifact (e.g., .zip file)
    - name: Package release
      run: |
        mkdir -p release
        zip -r release/package.zip . -x '*.git*' 'node_modules/*'

    # Step 5: Create a GitHub release
    - name: Create Release
      id: create-release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.sha }}
        release_name: Release ${{ github.sha }}
        body: |
          Automated release generated after merging into the main branch.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Step 6: Upload the packaged artifact to the release
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: release/labs-v1.0.0.zip
        asset_name: package.zip
        asset_content_type: application/zip